procs:
  terminal:
    shell: "fish"
  jj:
    shell: "jjui"
  test:
    autostart: false
    cwd: "flatlite-cli"
    shell: "cargo test"
  install:
    autostart: false
    cwd: "flatlite-cli"
    shell: "cargo install --path ."
  snapshot-review:
    autostart: false
    cwd: "flatlite-cli"
    shell: "cargo insta review"
  flatlite-cli:
    autostart: false
    cwd: "flatlite-cli"
    shell: "RUST_BACKTRACE=1 cargo run --bin flatlite-cli -- --config=../docs/db.kdl"
  flatlite-cli-debug:
    autostart: false
    cwd: "flatlite-cli"
    shell: "RUST_BACKTRACE=1 cargo run --bin flatlite-cli -- --config=../docs/db.kdl --diskcache --debug"
  generate-bigdata:
    autostart: false
    cwd: "flatlite-cli"
    shell: "RUST_BACKTRACE=1 cargo run --bin gen"
